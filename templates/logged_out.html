<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signed out · Network Monitor</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .login-card h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.15rem;
      margin: 0 0 4px;
    }
    .logout-check {
      width: 44px;
      height: 44px;
      margin: 4px auto 14px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card p.sub {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin: 0 0 22px;
    }
    .login-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      text-align: center;
      text-decoration: none;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 11px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .login-btn:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20" stroke-width="3"/>
        </svg>
        Network Monitor
      </h1>

      <div class="logout-check">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22c55e"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <p class="sub">You've been signed out.</p>
      <a class="login-btn" href="{{ url_for('main.login') }}">Log back in with U-M</a>
    </div>
  </div>
</body>
</html>
